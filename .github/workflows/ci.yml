name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package + test deps
        run: pip install -e . pytest httpx
      # Tests are self-contained: they train a tiny model on synthetic data,
      # so CI never needs the (gitignored) 1M-row dataset.
      - name: Run tests
        run: pytest -v
