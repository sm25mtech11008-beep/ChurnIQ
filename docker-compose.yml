# Prediction API + Postgres for persisting batch scores.
#   docker compose up --build
services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      CHURNIQ_MODEL: /app/models/churn_model.joblib
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: churniq
      POSTGRES_PASSWORD: churniq
      POSTGRES_DB: churniq
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
